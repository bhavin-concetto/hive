name: hive_generator
description: Extension for Hive. Automatically generates TypeAdapters to store any class.
version: 3.0.0
homepage: https://github.com/hivedb/hive/tree/master/hive_generator
documentation: https://docs.hivedb.dev/

publish_to: none

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  build: ^2.4.2
  source_gen: ^2.0.0
  hive: any
  analyzer: ^7.3.0
  source_helper: ^1.3.5

dev_dependencies:
  test: ^1.25.15
  build_test: ^2.2.3
  build_runner: ^2.4.15
  lints: ^5.1.1
