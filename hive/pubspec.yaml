name: hive
description: Lightweight and blazing fast key-value database written in pure Dart. Strongly encrypted using AES-256.
version: 4.0.0-dev
homepage: https://github.com/hivedb/hive/tree/master/hive
documentation: https://docs.hivedb.dev/

publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  meta: ^1.16.0
  crypto: ^3.0.6
  web: ^1.1.1
  idb_shim: 2.6.5+1

dev_dependencies:
  test: ^1.25.15
  mocktail: ^1.0.4
  lints: ^5.1.1
  path: ^1.9.1
  pointycastle: ^4.0.0
  build_runner: ^2.4.15
